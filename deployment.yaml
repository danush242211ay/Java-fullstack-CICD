
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullstack-deployment
  namespace: danush
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fullstack
  template:
    metadata:
      labels:
        app: fullstack
    spec:
      containers:
        - name: fullstack
          image: danu8747/fullstack:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "125m"
            limits:
              memory: "128Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: fullstack-service
  namespace: danush
spec:
  selector:
    app: fullstack
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

